[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harnessproof-mini"
version = "0.1.0"
description = "Reproducible synthetic-data fine-tuning and bounded multi-agent experimentation"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["harnessproof*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
